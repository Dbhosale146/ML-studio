[project]
name = "datalyon-api"
version = "0.1.0"
description = "Datalyon AI Data Scientist: internal app server, agent orchestrator and ML engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "python-multipart>=0.0.12",
  "pandas>=2.2",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "optuna>=4.1",
  "shap>=0.46",
  "joblib>=1.4",
  "mlflow-skinny>=2.18",
  "google-genai>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalyon"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "N803", "N806", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
packages = ["datalyon"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["datalyon.ml.*", "datalyon.agent.*"]
strict = true
# third-party ML libraries (pandas, sklearn, lightgbm, shap, optuna) ship without complete type stubs
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=datalyon.ml --cov=datalyon.agent --cov-report=term-missing:skip-covered"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
markers = ["slow: full pipeline runs on sample files"]
