[alembic]
script_location = alembic
prepend_sys_path = src
# sqlalchemy.url is set at runtime from Settings (see datalyon.db.session.Database.migrate)

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
